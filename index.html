            loadSavedData();
            renderUnits();
            updateProgressStats();
        });

        function loadSavedData() {
            try {
                const savedUrls = localStorage.getItem('math2a_unit_urls');
                if (savedUrls) {
                    unitUrls = JSON.parse(savedUrls);
                } else {
                    unitsData.forEach(u => {
                        unitUrls[u.id] = u.defaultUrl;
                        if (u.subsections) {
                            u.subsections.forEach(sub => {
                                unitUrls[sub.id] = sub.defaultUrl;
                            });
                        }
                    });
                }

                const savedCompleted = localStorage.getItem('math2a_completed_units');
                if (savedCompleted) {
                    completedUnits = JSON.parse(savedCompleted);
                }
            } catch (e) {
                console.error("Local storage error", e);
            }
        }

        function saveData() {
            localStorage.setItem('math2a_unit_urls', JSON.stringify(unitUrls));
            localStorage.setItem('math2a_completed_units', JSON.stringify(completedUnits));
        }

        function renderUnits() {
            const grid = document.getElementById('unitsGrid');
            grid.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = unitsData.filter(unit => {
                const matchesCat = (currentFilter === 'all') || (unit.category === currentFilter);
                const matchesSearch = unit.title.toLowerCase().includes(searchVal) || 
                                      unit.unitNum.toLowerCase().includes(searchVal) ||
                                      unit.desc.toLowerCase().includes(searchVal) ||
                                      unit.tags.some(t => t.toLowerCase().includes(searchVal)) ||
                                      (unit.subsections && unit.subsections.some(s => s.id.toLowerCase().includes(searchVal) || s.title.toLowerCase().includes(searchVal)));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2 opacity-50"></i>
                        <p>找不到符合條件的單元或小節</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(unit => {
                const isCompleted = !!completedUnits[unit.id];
                const isExpanded = !!expandedSubsections[unit.id];
                const unitUrl = unitUrls[unit.id] || unit.defaultUrl;

                let subHtml = '';
                if (unit.subsections && unit.subsections.length > 0) {
                    subHtml = `
                        <div id="sub_section_${unit.id}" class="${isExpanded ? 'block' : 'hidden'} mt-3 pt-3 border-t border-white/10 transition-all">
                            <div class="text-[11px] font-bold text-teal-300/90 mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-layer-group mr-1"></i>涵蓋小節：</span>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5">
                                ${unit.subsections.map(sub => `
                                    <div class="px-2 py-1.5 bg-slate-900/90 text-teal-200 border border-white/10 rounded-lg flex flex-col justify-center">
                                        <span class="text-[10px] font-extrabold text-teal-400">${sub.id}</span>
                                        <span class="truncate w-full text-[11px] font-medium text-slate-300">${sub.title}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden group ${isCompleted ? 'border-emerald-500/40 bg-slate-900/40' : ''}`;

                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${unit.color} opacity-10 rounded-bl-full pointer-events-none group-hover:opacity-20 transition-opacity"></div>
                    
                    <div>
                        <!-- Header / Unit Number -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${unit.badgeColor}">
                                ${unit.unitNum}
                            </span>
                            <button onclick="toggleCompleted('${unit.id}')" title="切換完成狀態" class="flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full transition-all ${isCompleted ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-white/5'}">
                                <i class="fa-solid ${isCompleted ? 'fa-circle-check text-emerald-400' : 'fa-circle'}"></i>
                                <span>${isCompleted ? '已標記完成' : '標記完成'}</span>
                            </button>
                        </div>

                        <!-- Title & Icon -->
                        <div class="flex items-start gap-3 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${unit.color} flex items-center justify-center text-white text-lg shadow-md shrink-0 mt-0.5">
                                <i class="fa-solid ${unit.icon}"></i>
                            </div>
                            <div>
                                <a href="${unitUrl}" target="_blank" title="點擊開啟 ${unit.unitNum}：${unit.title} 頁面" class="text-lg font-bold text-white hover:text-teal-300 transition-colors inline-flex items-center gap-1.5 group/title">
                                    <span>${unit.title}</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-teal-400 opacity-70 group-hover/title:opacity-100 transition-opacity"></i>
                                </a>
                                <p class="text-xs text-slate-300 mt-1 line-clamp-2 leading-relaxed">
                                    ${unit.desc}
                                </p>
                            </div>
                        </div>

                        <!-- Tags -->
                        <div class="flex flex-wrap gap-1.5 mb-3 mt-2">
                            ${unit.tags.map(tag => `<span class="text-[11px] bg-slate-900/60 text-slate-300 px-2 py-0.5 rounded-md border border-white/5"># ${tag}</span>`).join('')}
                        </div>
                    </div>

                    <div>
                        <!-- Main Action Buttons -->
                        <div class="pt-3 border-t border-white/10 flex items-center gap-2">
                            <button onclick="openPreview('${unit.id}')" class="flex-1 text-xs py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition-all border border-white/10 flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-eye text-teal-400"></i> 簡易教具預覽
                            </button>
                            <button onclick="toggleSubsections('${unit.id}')" class="flex-1 text-xs py-2 px-3 bg-gradient-to-r ${unit.color} hover:brightness-110 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center">
                                <span>顯示單元網頁</span>
                            </button>
                        </div>

                        <!-- Subsections Area -->
                        ${subHtml}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function toggleSubsections(unitId) {
            expandedSubsections[unitId] = !expandedSubsections[unitId];
            const subElem = document.getElementById(`sub_section_${unitId}`);
            if (subElem) {
                if (expandedSubsections[unitId]) {
                    subElem.classList.remove('hidden');
                    subElem.classList.add('block');
                } else {
                    subElem.classList.add('hidden');
                    subElem.classList.remove('block');
                }
            }
        }

        function toggleCompleted(unitId) {
            completedUnits[unitId] = !completedUnits[unitId];
            saveData();
            renderUnits();
            updateProgressStats();
            showToast(completedUnits[unitId] ? "已將單元標記為完成！" : "已取消單元完成標記");
        }

        function updateProgressStats() {
            const mainUnits = unitsData.filter(u => typeof u.id === 'number');
            const total = mainUnits.length;
            const completedCount = mainUnits.filter(u => completedUnits[u.id]).length;
            const percent = Math.round((completedCount / total) * 100);

            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completedCount;
            document.getElementById('progressText').innerText = `${percent}%`;

            const circle = document.getElementById('progressCircle');
            circle.setAttribute('stroke-dasharray', `${percent}, 100`);
        }

        function resetProgress() {
            completedUnits = {};
            saveData();
            renderUnits();
            updateProgressStats();
            showToast("學習紀錄已重置");
        }

        function setCategoryFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn active bg-teal-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-all shadow-md";
                } else {
                    btn.className = "cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition-all";
                }
            });
            renderUnits();
        }

        function filterUnits() {
            renderUnits();
        }

        function openConfigModal() {
            const container = document.getElementById('configInputsContainer');
            container.innerHTML = '';

            unitsData.forEach(u => {
                const currentUrl = unitUrls[u.id] || u.defaultUrl;
                const div = document.createElement('div');
                div.className = "bg-slate-900/70 p-3.5 rounded-xl border border-white/10 flex flex-col gap-2.5";

                div.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="sm:w-1/3">
                            <span class="text-xs font-bold text-teal-300">${u.unitNum}</span>
                            <div class="text-sm font-semibold text-white truncate">${u.title}</div>
                        </div>
                        <input type="text" id="url_input_${u.id}" value="${currentUrl}" placeholder="網址，例如：021/H021-0${u.id}.html"
                               class="sm:w-2/3 bg-slate-950 text-xs text-white px-3 py-2 rounded-lg border border-white/15 focus:outline-none focus:border-teal-400 font-mono">
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('configModal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
        }

        function saveUnitLinks() {
            unitsData.forEach(u => {
                const input = document.getElementById(`url_input_${u.id}`);
                if (input) {
                    unitUrls[u.id] = input.value.trim() || u.defaultUrl;
                }
            });
            saveData();
            renderUnits();
            closeConfigModal();
            showToast("單元網址設定已儲存");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function openPreview(unitId) {
            const unit = unitsData.find(u => String(u.id) === String(unitId));
            if (!unit) return;

            document.getElementById('previewUnitTitle').innerText = `${unit.unitNum}：${unit.title}`;

            const contentArea = document.getElementById('previewContent');
            contentArea.innerHTML = '';

            switch (unit.interactiveType) {
                case 'num200':
                    contentArea.innerHTML = renderNum200Demo();
                    initNum200Logic();
                    break;
                case 'calc2digit':
                    contentArea.innerHTML = renderCalc2DigitDemo();
                    initCalc2DigitLogic();
                    break;
                case 'rulerCm':
                    contentArea.innerHTML = renderRulerCmDemo();
                    initRulerCmLogic();
                    break;
                case 'addSubRel':
                    contentArea.innerHTML = renderAddSubRelDemo();
                    initAddSubRelLogic();
                    break;
                case 'capacity':
                    contentArea.innerHTML = renderCapacityDemo();
                    initCapacityLogic();
                    break;
                case 'twoSteps':
                    contentArea.innerHTML = renderTwoStepsDemo();
                    initTwoStepsLogic();
                    break;
                case 'multPart1':
                    contentArea.innerHTML = renderMultPart1Demo();
                    initMultPart1Logic();
                    break;
                case 'clockTime':
                    contentArea.innerHTML = renderClockTimeDemo();
                    initClockTimeLogic();
                    break;
                case 'multPart2':
                    contentArea.innerHTML = renderMultPart2Demo();
                    initMultPart2Logic();
                    break;
                case 'areaCompare':
                    contentArea.innerHTML = renderAreaCompareDemo();
                    initAreaCompareLogic();
                    break;

                    contentArea.innerHTML = `<p class="text-slate-400 text-sm">此單元互動教具載入中...</p>`;

            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        function initNum200Logic() {
            const input = document.getElementById('num200Input');
            const randBtn = document.getElementById('num200RandBtn');

            const update = () => {
                let val = parseInt(input.value) || 0;
                if (val > 200) val = 200;
                if (val < 1) val = 1;

                const hu = Math.floor(val / 100);
                const te = Math.floor((val % 100) / 10);
                const un = val % 10;

                document.getElementById('u1DigitHu').innerText = hu;
                document.getElementById('u1DigitTe').innerText = te;
                document.getElementById('u1DigitUn').innerText = un;

                document.getElementById('u1MoneyHu').innerHTML = hu > 0 ? `<span class="bg-blue-600/40 border border-blue-400 text-blue-200 px-2 py-0.5 rounded text-xs font-bold">100</span>`.repeat(hu) : '<span class="text-slate-600">-</span>';
                document.getElementById('u1MoneyTe').innerHTML = te > 0 ? `<span class="bg-teal-600/40 border border-teal-400 text-teal-200 px-1.5 py-0.5 rounded text-[10px] font-bold">10</span>`.repeat(te) : '<span class="text-slate-600">-</span>';
                document.getElementById('u1MoneyUn').innerHTML = un > 0 ? `<span class="bg-amber-600/40 border border-amber-400 text-amber-200 px-1.5 py-0.5 rounded text-[10px] font-bold">1</span>`.repeat(un) : '<span class="text-slate-600">-</span>';

                document.getElementById('u1Breakdown').innerText = `${val} = ${hu} 個百 + ${te} 個十 + ${un} 個一 (${hu*100} + ${te*10} + ${un})`;
            };

            if (input) input.oninput = update;
            if (randBtn) {
                randBtn.onclick = () => {
                    input.value = Math.floor(Math.random() * 190) + 10;
                    update();
                };
            }
            update();
        }

        function renderCalc2DigitDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="flex gap-2 mb-3 bg-slate-900/90 p-1.5 rounded-xl border border-white/10">

                        <button id="u2RandBtn" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg text-slate-300 border border-white/10"><i class="fa-solid fa-dice"></i> 出題</button>

                        </div>

                        <div id="u2RowA" class="grid grid-cols-3 gap-2 text-white font-bold text-center"></div>
                        <div id="u2RowB" class="grid grid-cols-3 gap-2 text-blue-300 font-bold border-b-2 border-white/40 pb-1.5 my-1 text-center"></div>
                        <div id="u2RowAns" class="grid grid-cols-3 gap-2 text-amber-300 font-black text-center pt-1"></div>
                    </div>

                </div>
            `;
        }

        let u2Op = '+';
        function switchU2Op(op) {
            u2Op = op;
            document.getElementById('u2BtnAdd').className = op === '+' ? "px-3 py-1 rounded-lg text-xs font-bold bg-blue-500 text-white" : "px-3 py-1 rounded-lg text-xs font-bold text-slate-300";
            document.getElementById('u2BtnSub').className = op === '-' ? "px-3 py-1 rounded-lg text-xs font-bold bg-blue-500 text-white" : "px-3 py-1 rounded-lg text-xs font-bold text-slate-300";
            document.getElementById('u2OpSign').innerText = op;
            if (typeof updateU2 === 'function') updateU2();
        }

        function initCalc2DigitLogic() {
            const numA = document.getElementById('u2NumA');
            const numB = document.getElementById('u2NumB');
            const randBtn = document.getElementById('u2RandBtn');

            window.updateU2 = () => {
                let a = parseInt(numA.value) || 0;
                let b = parseInt(numB.value) || 0;

                if (u2Op === '-' && a < b) {
                    const temp = a; a = b; b = temp;
                    numA.value = a; numB.value = b;
                }

                let ans = u2Op === '+' ? (a + b) : (a - b);
                const strA = String(a).padStart(3, ' ');
                const strB = String(b).padStart(3, ' ');
                const strAns = String(ans).padStart(3, ' ');

                const te = Math.floor((a % 100) / 10);
                const borrow = (u2Op === '-' && (a % 10) < (b % 10)) ? 1 : 0;

                let rowAHtml = '';
                strA.split('').forEach((c, idx) => {
                    if (c === ' ') {
                        rowAHtml += `<span>&nbsp;</span>`;
                    } else if (idx === 1 && borrow) {
                        rowAHtml += `<span class="text-white line-through decoration-amber-400 decoration-2">${c}</span>`;
                    } else {
                        rowAHtml += `<span>${c}</span>`;
                    }
                });
                document.getElementById('u2RowA').innerHTML = rowAHtml;

                document.getElementById('u2RowB').innerHTML = `<span class="text-blue-400 font-extrabold">${u2Op}</span>` + strB.substring(1).split('').map(c => `<span>${c===' '?'&nbsp;':c}</span>`).join('');
                document.getElementById('u2RowAns').innerHTML = strAns.split('').map(c => `<span>${c===' '?'&nbsp;':c}</span>`).join('');

                if (u2Op === '+') {
                    const unAdd = (a % 10) + (b % 10);
                    const carry = unAdd >= 10 ? 1 : 0;
                    document.getElementById('u2CarryRow').innerHTML = `<span></span><span>${carry?1:''}</span><span></span>`;
                    document.getElementById('u2Tip').innerHTML = `<b>加法進位說明：</b><br>個位相加：${a%10} + ${b%10} = ${unAdd} ${carry?'(滿十向十位進 1)':''}<br>計算結果：<span class="text-amber-300 font-bold">${a} + ${b} = ${ans}</span>`;
                } else {
                    document.getElementById('u2CarryRow').innerHTML = `<span></span><span>${borrow ? (te - 1) : ''}</span><span>${borrow ? '10' : ''}</span>`;
                    document.getElementById('u2Tip').innerHTML = `<b>減法退位說明：</b><br>個位比較：${a%10} - ${b%10} ${borrow?'不夠減，從十位借 1 當 10':'夠減'}<br>計算結果：<span class="text-amber-300 font-bold">${a} - ${b} = ${ans}</span>`;
                }
            };

            if (numA) numA.oninput = window.updateU2;
            if (numB) numB.oninput = window.updateU2;
            if (randBtn) {
                randBtn.onclick = () => {
                    numA.value = Math.floor(Math.random() * 70) + 20;
                    numB.value = Math.floor(Math.random() * 40) + 5;
                    window.updateU2();
                };
            }
            window.updateU2();
        }

        function initRulerCmLogic() {
            const range = document.getElementById('u3CmRange');
            const valDisp = document.getElementById('u3CmVal');
            const svg = document.getElementById('u3CmSvg');
            const info = document.getElementById('u3Info');

            const draw = () => {
                const cm = parseInt(range.value) || 1;
                valDisp.innerText = `${cm} cm`;
                
                const step = 24; // 24px per cm spacing
                const startX = 20; // Tick '0' is exactly at x = 20px
                const endX = startX + cm * step;

                let svgContent = `
                    <!-- Object Bar starting precisely at x = startX (Tick 0) -->
                    <rect x="${startX}" y="2" width="${cm * step}" height="26" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" rx="5"/>
                    <text x="${startX + (cm * step) / 2}" y="19" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">物體長度：${cm} 公分</text>

                    <!-- Red Dashed Guideline at End -->
                    <line x1="${endX}" y1="2" x2="${endX}" y2="80" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>

                    <!-- Ruler Body -->
                    <rect x="5" y="34" width="400" height="46" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="6"/>
                `;

                for (let i = 0; i <= 15; i++) {
                    const x = startX + i * step;
                    // Major tick
                    svgContent += `<line x1="${x}" y1="34" x2="${x}" y2="52" stroke="#0f172a" stroke-width="2"/>`;
                    
                    // Text labels
                    if (i === 15) {
                        svgContent += `<text x="${x}" y="67" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">15</text>`;
                        svgContent += `<text x="${x + 15}" y="67" font-size="8.5" font-weight="bold" fill="#0f172a">cm</text>`;
                    } else {
                        svgContent += `<text x="${x}" y="67" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">${i}</text>`;
                    }

                    // Half cm tick
                    if (i < 15) {
                        const midX = x + step / 2;
                        svgContent += `<line x1="${midX}" y1="34" x2="${midX}" y2="44" stroke="#64748b" stroke-width="1.2"/>`;
                    }
                }

                // End indicator dot
                svgContent += `<circle cx="${endX}" cy="34" r="3" fill="#dc2626"/>`;

                svg.innerHTML = svgContent;
                info.innerHTML = `起點對準刻度 0，終點對準刻度 <b class="text-amber-300 font-bold">${cm}</b>，此物體長度為 <b class="text-teal-300 font-bold">${cm} 公分</b> (${cm} cm)。`;
            };

            if (range) range.oninput = draw;
            draw();
        }

        function initClockTimeLogic() {
            const hRange = document.getElementById('u8Hour');
            const mRange = document.getElementById('u8Min');
            const svg = document.getElementById('u8ClockSvg');
            const text = document.getElementById('u8TimeText');

            const drawClock = () => {
                const h = parseInt(hRange.value) || 8;
                const m = parseInt(mRange.value) || 0;

                text.innerText = `報讀時刻：${h} 時 ${m===0?'00':m} 分`;

                let clockSvg = `<circle cx="90" cy="90" r="80" fill="#f8fafc" stroke="#7c3aed" stroke-width="5"/>`;
                for (let i = 1; i <= 12; i++) {
                    const angle = (i * 30 - 90) * (Math.PI / 180);
                    const tx = 90 + 62 * Math.cos(angle);
                    const ty = 90 + 62 * Math.sin(angle) + 4;
                    clockSvg += `<text x="${tx}" y="${ty}" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">${i}</text>`;
                }

                // Hour Hand
                const hAngle = ((h % 12) * 30 + m * 0.5 - 90) * (Math.PI / 180);
                const hx = 90 + 40 * Math.cos(hAngle);
                const hy = 90 + 40 * Math.sin(hAngle);
                clockSvg += `<line x1="90" y1="90" x2="${hx}" y2="${hy}" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>`;

                // Minute Hand
                const mAngle = (m * 6 - 90) * (Math.PI / 180);
                const mx = 90 + 58 * Math.cos(mAngle);
                const my = 90 + 58 * Math.sin(mAngle);
                clockSvg += `<line x1="90" y1="90" x2="${mx}" y2="${my}" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>`;

                clockSvg += `<circle cx="90" cy="90" r="5" fill="#dc2626"/>`;

                svg.innerHTML = clockSvg;
            };

            if (hRange) hRange.oninput = drawClock;
            if (mRange) mRange.oninput = drawClock;
            drawClock();
        }
